{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2>🔐 Réinitialiser le mot de passe</h2>
    <p>Entrez votre adresse email pour recevoir un lien de réinitialisation.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Envoyer le lien</button>
    </form>
</div>
{% endblock %}
