<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Connexion | ZemiConnect</title>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-blue-100 min-h-screen">
    <!-- Logo fixe en haut à droite -->
    <div class="fixed top-4 right-4 z-10">
        <div class="bg-indigo-100 p-3 rounded-2xl hover:bg-indigo-200 transition-colors shadow-sm">
            <img src="../../../media/img/logo.jpg" alt="Logo ZemiConnect" class="w-20 h-20 md:w-24 md:h-24">
        </div>
    </div>

    <!-- Contenu centré -->
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 md:p-12">
            <!-- En-tête -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">
                    <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-blue-500">
                        Connexion
                    </span>
                </h1>
            </div>

            <!-- Messages -->
            {% if messages %}
                <div class="mb-6 space-y-2">
                    {% for message in messages %}
                        <div class="p-3 rounded-lg text-sm {% if message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-indigo-100 text-indigo-700{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <!-- Formulaire -->
            <form method="post" class="space-y-6">
                {% csrf_token %}

                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Nom d'utilisateur</label>
                    <input type="text" name="username" id="username" required
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all outline-none"
                        placeholder="Saisissez votre nom d'utilisateur">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Mot de passe</label>
                    <input type="password" name="password" id="password" required
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all outline-none"
                        placeholder="••••••••">
                </div>

                <input type="hidden" name="next" value="{{ next }}">

                <button type="submit"
                    class="w-full bg-gradient-to-r from-indigo-600 to-blue-500 text-white font-semibold py-3 rounded-lg hover:opacity-90 transition-opacity shadow-md">
                    Se connecter
                </button>
            </form>

            <!-- Liens utiles -->
            <div class="mt-6 text-center space-y-3 text-sm">
                <p class="text-gray-600">Pas encore inscrit ?  Contactez votre administrateur
                </p>
                <a href="{% url 'password_reset' %}" class="text-indigo-600 hover:text-indigo-800 font-medium">
                    Mot de passe oublié ?
                </a>
            </div>
        </div>
    </div>
</body>
</html>
