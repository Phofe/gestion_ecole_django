<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord Agent | ZemiConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-blue-100 min-h-screen">
    <!-- En-tête fixe -->
    <header class="fixed top-0 left-0 right-0 bg-white shadow-sm z-20">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <div class="bg-indigo-100 p-2 rounded-xl">
                    <img src="../../../media/img/logo.jpg" alt="Logo ZemiConnect" class="w-20 h-20 md:w-24 md:h-24">
                </div>
                <div>
                    <h1 class="text-xl font-semibold">
                        <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-blue-500">
                            Tableau de bord Agent
                        </span>
                    </h1>
                </div>
            </div>

            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="flex items-center text-red-600 hover:text-red-800 font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 mr-1">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
                    </svg>
                    Déconnexion
                </button>
            </form>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="pt-24 pb-12 max-w-6xl mx-auto px-4">
        <div class="bg-white rounded-2xl shadow-xl p-8 md:p-12">
            <!-- Message de bienvenue -->
            <div class="text-center mb-8">
                <div class="mx-auto mb-4 bg-indigo-100 w-fit p-3 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 text-indigo-600">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                    </svg>
                </div>
                <h2 class="text-3xl font-bold mb-2">
                    Bienvenue, {{ request.user.get_full_name }}
                </h2>
                <p class="text-gray-600">Vous êtes connecté en tant qu'agent de contrôle certifié</p>
            </div>




        </div>
    </main>
</body>
</html>
