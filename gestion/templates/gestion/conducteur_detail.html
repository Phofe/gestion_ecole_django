<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>{{ conducteur.nom }} | ZemiConnect</title>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-blue-100 min-h-screen flex items-center justify-center p-4">
    <!-- Carte type badge -->
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- En-tête holographique -->
        <div class="h-2 bg-gradient-to-r from-blue-500 to-indigo-600"></div>

        <!-- Contenu principal -->
        <div class="grid md:grid-cols-3 gap-8 p-8">
            <!-- Photo et QR Code -->
            <div class="space-y-6">
                <div class="border-2 border-indigo-100 rounded-lg p-1">
                    <img src="{{ conducteur.photo.url }}"
                         alt="Photo du conducteur"
                         class="w-full aspect-square object-cover rounded-lg">
                </div>
            </div>

            <!-- Informations textuelles -->
            <div class="md:col-span-2">
                <!-- En-tête -->
                <div class="mb-6 border-b pb-4">
                    <div class="flex justify-between items-start">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-900">{{ conducteur.prenoms }}</h1>
                            <h2 class="text-3xl font-black text-gray-900 uppercase">{{ conducteur.nom }}</h2>
                        </div>
                        <img src="../../../media/img/logo.jpg" alt="Logo ZemiConnect" class="w-20 h-20 md:w-24 md:h-24">
                    </div>
                </div>

                <!-- Détails -->
                <div class="grid grid-cols-2 gap-4 text-sm">
                    <div>
                        <div class="text-gray-500 font-medium">N° Identification</div>
                        <div class="text-gray-900 font-mono">{{ conducteur.numero_identification }}</div>
                    </div>

                    <div>
                        <div class="text-gray-500 font-medium">Téléphone</div>
                        <div class="text-gray-900">{{ conducteur.telephone }}</div>
                    </div>


                </div>

                <!-- Section agent -->
                <div class="mt-8 pt-6 border-t border-dashed">
                    <div class="text-center bg-indigo-50 rounded-lg p-4">
                        <p class="text-sm text-gray-600 mb-3">Accès contrôleur agréé</p>
                        <a href="{% url 'custom_login' %}?next={% url 'agent_conducteur_detail' conducteur.pk %}"
                           class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white rounded-md text-sm hover:bg-indigo-700 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 mr-2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                            </svg>
                            Authentification requise
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bandeau de sécurité -->
        <div class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white py-2 px-4 text-xs text-center font-medium">
            VALIDE • {{ conducteur.numero_identification }} • ZemiConnect © {{ "now" | date:"Y" }}
        </div>
    </div>
</body>
</html>
