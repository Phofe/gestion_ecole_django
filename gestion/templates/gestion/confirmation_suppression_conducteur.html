<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Confirmation de suppression</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded shadow">
    <h2 class="text-xl font-bold mb-4">Confirmation</h2>
    <p>Voulez-vous vraiment supprimer <strong>{{ objet }}</strong> ?</p>

    <form method="post">
        {% csrf_token %}
        <div class="mt-4 flex justify-between">
            <a href="{% url 'liste_conducteurs' %}" class="bg-gray-300 px-4 py-2 rounded">Annuler</a>
            <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Supprimer</button>
        </div>
    </form>
</div>

</body>
</html>
