<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Taxi-Moto Parakou | Gestion des conducteurs</title>
    <style>
        @keyframes slide {
            0% { opacity: 0; transform: scale(1.05); }
            10% { opacity: 1; transform: scale(1); }
            90% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.05); }
        }
        .slideshow img {
            animation: slide 16s infinite;
            z-index: 0;
        }
        .slideshow img:nth-child(1) { animation-delay: 0s; }
        .slideshow img:nth-child(2) { animation-delay: 2s; }
        .slideshow img:nth-child(3) { animation-delay: 4s; }
        .slideshow img:nth-child(4) { animation-delay: 6s; }
    </style>
</head>
<body class="min-h-screen relative overflow-hidden">
    <!-- Carrousel d'images -->
    <div class="slideshow fixed inset-0 z-0">
        <img src="../../../media/img/1.jpg" class="absolute inset-0 w-full h-full object-cover opacity-0">
        <img src="../../../media/img/2.jpg" class="absolute inset-0 w-full h-full object-cover opacity-0">
        <img src="../../../media/img/3.jpg" class="absolute inset-0 w-full h-full object-cover opacity-0">
        <img src="../../../media/img/4.jpg" class="absolute inset-0 w-full h-full object-cover opacity-0">
        <div class="absolute inset-0 bg-black/30"></div>
    </div>

    <!-- Logo fixe en haut à droite -->
    <div class="fixed top-4 right-4 z-10">
        <div class="bg-indigo-100 p-3 rounded-2xl hover:bg-indigo-200 transition-colors shadow-sm">
            <img src="../../../media/img/logo.jpg" alt="Logo ZemiConnect" class="w-20 h-20 md:w-24 md:h-24">
        </div>
    </div>

    <!-- Contenu principal -->
    <div class="min-h-screen flex items-center justify-center relative z-10">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <h1 class="text-4xl font-bold text-white mb-4 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">
                <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-200 to-blue-100">
                    Bienvenue sur ZemiConnect
                </span>
            </h1>
            <p class="text-xl text-white/90 mb-8 drop-shadow-md">Gestion professionnelle des taxis-motos</p>

            <a href="{% url 'login' %}" class="inline-block px-8 py-4 bg-gradient-to-r from-indigo-600/90 to-blue-500/90 text-white font-semibold rounded-lg shadow-lg hover:shadow-xl transition-all duration-300 hover:scale-[1.02] backdrop-blur-sm">
                Connexion Gestionnaire
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 inline-block ml-2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
                </svg>
            </a>
        </div>
    </div>
</body>
</html>
