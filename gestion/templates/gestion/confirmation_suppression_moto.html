<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Suppression de la moto</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-lg mx-auto bg-white p-6 rounded-xl shadow-md text-center">
        <h1 class="text-2xl font-bold text-red-600 mb-4">Confirmer la suppression</h1>

        <p class="text-gray-700 mb-6">
            Êtes-vous sûr de vouloir supprimer la moto de <strong>{{ moto.conducteur.nom }} {{ moto.conducteur.prenoms }}</strong> ?
        </p>

        <form method="post" class="flex justify-center gap-4">
            {% csrf_token %}
            <a href="{% url 'dashboard' %}" class="bg-gray-300 text-gray-800 px-4 py-2 rounded hover:bg-gray-400">
                Annuler
            </a>
            <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
                Supprimer
            </button>
        </form>
    </div>
</body>
</html>
